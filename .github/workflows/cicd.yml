---

name: Continuous Testing

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The wheels only change when the list in madeProfile.ts does; a jupyterlite.mat3ra.com
      # outage must not fail unrelated builds.
      - name: Cache provisioned wheels
        uses: actions/cache@v4
        with:
          path: public/packages
          key: made-wheels-${{ hashFiles('src/environment/madeProfile.ts') }}

      - name: Build the embeddable page
        run: npm run build
